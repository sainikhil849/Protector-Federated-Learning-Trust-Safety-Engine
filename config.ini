# Configuration file for Protector Uttam Demo Execution
# This file controls all aspects of the demo pipeline

[environment]
python_version = 3.12.10
use_venv = true
venv_path = .venv
pip_packages_file = requirements.txt

[dataset]
# Dataset location and configuration
dataset_path = Dataset
data_profiles_path = data/profiles
dataset_profile = data/profiles/dataset_profile.json
libsvm_format = true
expected_features = 128
expected_labels = 6
sample_data_test_split = 0.8

[processing]
# Data processing parameters
outlier_threshold = 3.0
feature_min = 0.1
feature_max = 170000
sparse_format = true
schema_validation_enabled = true
max_processing_workers = 4

[federation]
# Federated learning simulation parameters
num_participants = 10
local_epochs = 5
global_rounds = 3
batch_size = 32
learning_rate = 0.01
aggregation_method = federated_averaging

[training]
# Local training parameters
framework = scikit-learn
model_type = logistic_regression
max_iterations = 100
tolerance = 1e-4
random_state = 42

[trust_scoring]
# Trust scoring configuration
scoring_enabled = true
dqs_weight = 0.20
dhs_weight = 0.20
uss_weight = 0.30
rs_weight = 0.15
ps_weight = 0.15
confidence_threshold = 0.75
hard_safety_required = true

[decision_thresholds]
# Decision boundaries for trust scores
allow_threshold = 75
monitor_threshold = 60
review_threshold = 40
block_threshold = 0

[safety]
# Safety and fail-safe configuration
fail_safe_enabled = true
fail_safe_mode_default = BLOCK
invalid_data_decision = BLOCK
invalid_structure_decision = BLOCK
unknown_state_decision = REVIEW
database_unavailable_decision = RESTRICT

[staleness]
# Freshness policy for trust evaluations
twarning_days = 14
warning_days = 14
restrict_days = 30
block_days = 180

[validation]
# Validation framework configuration
validation_enabled = true
ground_truth_scenarios = 8
precision_target = 0.85
recall_target = 0.85
f1_target = 0.85

[experiments]
# Experiment execution configuration
num_experiments = 100
experiment_output_path = experiments/results
validation_enabled = true
ablation_testing = true

[tests]
# Test suite configuration
core_tests_enabled = true
stability_tests_enabled = true
resilience_tests_enabled = true
failure_injection_enabled = true
performance_target_ms = 1000

[logging]
# Logging configuration
log_level = INFO
log_file = logs/execution.log
save_profiles = true
save_results = true
verbose_output = true

[output]
# Output configuration
results_path = experiments/results
docs_path = docs
charts_path = docs/charts
save_csv_results = true
save_json_results = true
generate_charts = false
